<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LawSetu Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Parent div with white bg + shadow -->
 <div class="container-fluid parent">
  <div class="row">
 <!-- Left section -->
    <div class="left">
      <img src="LawSetu/LawSetu Login.png" alt="LawSetu Logo" class="logo">
    </div>
 <!--Left Section END-->
<!-- Right section -->
   <div class="right">
      <h2>Welcome Back!</h2>
      <p>Please login to your account</p>
      
      <!-- Tab buttons -->
      <div class="login-tabs">
        <button type="button" class="tab-btn active" data-tab="client">Client</button>
        <button type="button" class="tab-btn" data-tab="lawyer">Lawyer</button>
      </div>

      <!-- Client Login Form -->
      <form id="clientLoginForm" class="login-form active">
        <div class="form-group">
          <label for="clientEmail">Email Address</label>
          <input type="email" id="clientEmail" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="clientPassword">Password</label>
          <input type="password" id="clientPassword" name="password" placeholder="Enter your password" required>
        </div>
        <a href="#" class="forgot-link">Forgot Password?</a>
        <button type="submit">Login as Client</button>
        <div class="signup-link">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
      </form>

      <!-- Lawyer Login Form -->
      <form id="lawyerLoginForm" class="login-form">
        <div class="form-group">
          <label for="lawyerEmail">Email Address</label>
          <input type="email" id="lawyerEmail" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="lawyerPassword">Password</label>
          <input type="password" id="lawyerPassword" name="password" placeholder="Enter your password" required>
        </div>
        <div class="form-group">
          <label for="barCouncilId">Bar Council ID</label>
          <input type="text" id="barCouncilId" name="barCouncilId" placeholder="Enter your Bar Council ID" required>
        </div>
        <div class="form-group">
          <label for="lawyerState">State</label>
          <select id="lawyerState" name="state" required>
            <option value="">Select State</option>
            <option value="AP">Andhra Pradesh</option>
            <option value="DL">Delhi</option>
            <option value="KA">Karnataka</option>
            <option value="MH">Maharashtra</option>
            <option value="TN">Tamil Nadu</option>
            <option value="UP">Uttar Pradesh</option>
            <option value="WB">West Bengal</option>
            <option value="GJ">Gujarat</option>
            <option value="RJ">Rajasthan</option>
            <option value="MP">Madhya Pradesh</option>
          </select>
        </div>
        <a href="#" class="forgot-link">Forgot Password?</a>
        <button type="submit">Login as Lawyer</button>
        <div class="signup-link">
          Don't have an account? <a href="signup.html">Register as Lawyer</a>
        </div>
      </form>
   </div>  
<!--Right Section END-->
 </div>
</div>

<script src="script.js"></script>
</body>
</html>
